name: Check links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links between pages
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude-path dpcn/node_modules
            --exclude-path 'dpcn/src.*'
            --exclude-path dpcn/shared
            --exclude-path 404.html
            './**/*.html'
          fail: true
