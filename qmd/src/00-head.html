<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QMD Study Guide · End-sem Blitz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Quantum Materials and Devices (SC1.311) end-sem on one page for someone who has not attended the course: the basics, every topic of the four modules in plain words, the answer to write in the exam, and last year's papers worked through.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --muted:#f4f4f5; --muted-2:#fafafa;
  --fg:#09090b; --muted-fg:#6b6b75; --border:#e4e4e7; --border-2:#d4d4d8;
  --primary:#18181b; --primary-fg:#fafafa;
  --brand:#0f766e; --brand-fg:#ffffff; --brand-soft:#effaf8;
  --stable:#0f766e; --unstable:#c2410c; --destructive:#dc2626; --destructive-soft:#fef2f2;
  --amber-soft:#fffbeb; --amber:#b45309;
  --c1:#0f766e; --c2:#c2410c; --c3:#4f46e5; --c4:#a21caf;
  --grid:#efeff1; --axis:#a1a1aa;
  --node:#f4f4f5; --node-stroke:#3f3f46; --edge:#a1a1aa;
  --radius:0.7rem;
  --shadow-sm:0 1px 2px 0 rgb(9 9 11 / .05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0b0b0d; --card:#121215; --muted:#1c1c20; --muted-2:#16161a;
  --fg:#f4f4f5; --muted-fg:#a1a1aa; --border:#27272a; --border-2:#3f3f46;
  --primary:#f4f4f5; --primary-fg:#18181b;
  --brand:#2dd4bf; --brand-fg:#09090b;
  --brand-soft:#112926;
  --stable:#2dd4bf; --unstable:#fb923c; --destructive:#f87171; --destructive-soft:#2a1414;
  --amber-soft:#2a2110; --amber:#fbbf24;
  --c1:#2dd4bf; --c2:#fb923c; --c3:#a5b4fc; --c4:#f0abfc;
  --grid:#1f1f24; --axis:#52525b;
  --node:#1c1c20; --node-stroke:#a1a1aa; --edge:#5b5b63;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .4);
}}
:root[data-theme="dark"]{
  --bg:#0b0b0d; --card:#121215; --muted:#1c1c20; --muted-2:#16161a;
  --fg:#f4f4f5; --muted-fg:#a1a1aa; --border:#27272a; --border-2:#3f3f46;
  --primary:#f4f4f5; --primary-fg:#18181b;
  --brand:#2dd4bf; --brand-fg:#09090b; --brand-soft:#112926;
  --stable:#2dd4bf; --unstable:#fb923c; --destructive:#f87171; --destructive-soft:#2a1414;
  --amber-soft:#2a2110; --amber:#fbbf24;
  --c1:#2dd4bf; --c2:#fb923c; --c3:#a5b4fc; --c4:#f0abfc;
  --grid:#1f1f24; --axis:#52525b;
  --node:#1c1c20; --node-stroke:#a1a1aa; --edge:#5b5b63;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0; background:var(--bg); color:var(--fg);
  font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  font-size:16.5px; line-height:1.68; -webkit-font-smoothing:antialiased}
.wrap{display:grid; grid-template-columns:minmax(0,1fr)}
@media(min-width:1060px){.wrap{grid-template-columns:280px minmax(0,1fr); align-items:start}}

/* sidebar */
.toc{position:sticky; top:0; align-self:start; max-height:100vh; overflow-y:auto; padding:26px 18px 48px;
  border-right:1px solid var(--border); background:var(--card); display:none; scrollbar-width:thin; scrollbar-color:var(--border-2) transparent}
@media(min-width:1060px){.toc{display:block}}
.toc .brand{font-weight:700; font-size:1.02rem; letter-spacing:-.02em}
.toc .brand small{display:block; font-weight:500; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-fg); margin-top:6px}
.toc nav{margin-top:20px; font-size:.86rem}
.toc .grp{text-transform:uppercase; letter-spacing:.11em; font-size:.64rem; color:var(--muted-fg); font-weight:700; margin:20px 0 6px; padding:0 10px}
.toc a{display:block; color:var(--muted-fg); text-decoration:none; padding:5px 10px; border-radius:7px; line-height:1.35; margin:1px 0}
.toc a:hover{color:var(--fg); background:var(--muted)}
.toc a.other{margin:12px 0 0; padding:7px 10px; border:1px solid var(--border); border-radius:8px; color:var(--brand); font-size:.84rem; font-weight:600}
.toc a.other:hover{background:var(--muted)}
.toc a.active{color:var(--fg); background:var(--muted); font-weight:600}

main{padding:0 clamp(18px,5vw,72px) 128px; max-width:900px}
.hero{padding:clamp(44px,8vw,84px) 0 30px; border-bottom:1px solid var(--border)}
.kicker{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-fg); font-weight:600}
h1{font-weight:700; font-size:clamp(2.1rem,6vw,3.2rem); line-height:1.05; letter-spacing:-.035em; margin:.34em 0 .3em; text-wrap:balance}
.hero .lead{font-size:1.12rem; color:var(--muted-fg); max-width:62ch; line-height:1.6}
.part{margin:4.2em 0 0; padding:14px 0 0; border-top:2px solid var(--fg); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700}
.part span{color:var(--muted-fg); font-weight:600; margin-left:.6em}
h2{font-weight:700; font-size:clamp(1.55rem,3.4vw,2rem); letter-spacing:-.03em; margin:2.4em 0 .2em; padding-top:.3em; text-wrap:balance; scroll-margin-top:14px}
.part+section h2{margin-top:.9em}
h2 .num{color:var(--muted-fg); font-size:.56em; font-weight:600; margin-right:.55em; font-variant-numeric:tabular-nums}
h3{font-weight:650; font-size:1.25rem; margin:2em 0 .35em; letter-spacing:-.02em; scroll-margin-top:14px}
h4{font-weight:700; font-size:1.02rem; margin:1.5em 0 .3em}
.oneline{font-size:1.1rem; line-height:1.55; max-width:64ch; margin:.6em 0 1em}
p{max-width:70ch}
a{color:var(--brand); text-underline-offset:2px}
em.t{font-style:normal; font-weight:650; border-bottom:2px solid var(--brand)}
ul,ol{max-width:68ch; padding-left:1.35em}
li{margin:.35em 0}
li::marker{color:var(--muted-fg)}
.small{font-size:.87rem; color:var(--muted-fg)}
.board{font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--amber); background:var(--amber-soft);
  border:1px solid color-mix(in srgb,var(--amber) 35%,var(--border)); border-radius:6px; padding:3px 9px; display:inline-block; margin-top:6px}

/* math */
math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",math,serif; font-style:normal}
p math, li math, td math, summary math, figcaption math{font-size:1.07em}
.eq{display:block; margin:18px 0; text-align:center; overflow-x:auto; overflow-y:hidden; padding:6px 2px}
.eq math{font-size:1.36em}
.eq.boxed{background:var(--muted-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px}
.eq .label{display:block; margin-top:6px; font-size:.8rem; color:var(--muted-fg)}
math .tml-box, math menclose{border:1px solid var(--border-2); padding:3px}

/* cards */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px; margin:20px 0; box-shadow:var(--shadow-sm)}
.card>*:first-child{margin-top:0} .card>*:last-child{margin-bottom:0}
.card.ex{background:var(--muted-2)}
.card.watch{border-color:color-mix(in srgb,var(--destructive) 40%,var(--border)); background:var(--destructive-soft)}
.card.goal{border-color:color-mix(in srgb,var(--brand) 35%,var(--border))}
.card.exam{border:1.5px solid var(--fg)}
.card.remember{background:var(--brand-soft); border-color:color-mix(in srgb,var(--brand) 35%,var(--border))}
.remember .tag{background:var(--brand); color:var(--brand-fg); border-color:var(--brand)}
.about{font-size:1.08rem; line-height:1.6; max-width:66ch; margin:.6em 0 1em}
.idea{background:var(--brand-soft); border:1px solid color-mix(in srgb,var(--brand) 30%,var(--border)); border-radius:8px; padding:10px 14px; max-width:none}
.sym{font-size:.93rem; color:var(--muted-fg); margin:10px 0}
.tag{display:inline-flex; font-size:.66rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 9px; border-radius:6px;
  border:1px solid var(--border); background:var(--muted); color:var(--muted-fg); margin-bottom:10px}
.goal .tag{background:var(--brand-soft); color:var(--brand); border-color:color-mix(in srgb,var(--brand) 35%,var(--border))}
.exam .tag{background:var(--primary); color:var(--primary-fg); border-color:var(--primary)}
.watch .tag{background:transparent; color:var(--destructive); border-color:color-mix(in srgb,var(--destructive) 45%,var(--border))}
.card h4:first-of-type{margin-top:.1em}
.goal ul{margin:.2em 0}

.steps{counter-reset:s; list-style:none; padding-left:0; max-width:72ch}
.steps>li{counter-increment:s; position:relative; padding-left:42px; margin:.95em 0}
.steps>li::before{content:counter(s); position:absolute; left:0; top:0; width:27px; height:27px; border-radius:8px;
  background:var(--primary); color:var(--primary-fg); font-size:.8rem; font-weight:700; display:grid; place-items:center}

/* tables */
.tbl{width:100%; border-collapse:collapse; margin:16px 0; font-size:.92rem; display:block; overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--border); padding:9px 12px; text-align:left; vertical-align:top}
.tbl th{background:var(--muted); font-weight:650; font-size:.82rem}
.tbl tr:nth-child(even) td{background:var(--muted-2)}
.tbl td.c, .tbl th.c{text-align:center}

/* figures */
figure.fig{margin:20px 0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm)}
figure.fig svg{width:100%; height:auto; display:block; margin:0 auto}
figure.fig svg.gr{max-width:460px}
figure.fig svg.plot{max-width:620px}
figure.fig figcaption{font-size:.86rem; color:var(--muted-fg); margin-top:10px; line-height:1.5; max-width:70ch}
.figrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:20px 0}
.figrow figure.fig{margin:0}
svg.plot text{font-family:"Hanken Grotesk",sans-serif}
svg.plot .tk{font-size:11px; fill:var(--muted-fg)}
svg.plot .al{font-size:12.5px; fill:var(--muted-fg)}
svg.plot .lb{font-size:12px; font-weight:600}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.82rem; color:var(--muted-fg); margin:4px 0 10px}
.legend span{display:inline-flex; align-items:center; gap:7px}
.sw{width:24px; height:0; border-top:3px solid; display:inline-block}

/* collapsibles */
details.opt{border:1px dashed var(--border-2); border-radius:var(--radius); background:var(--muted-2); margin:16px 0; overflow:hidden}
details.opt>summary{cursor:pointer; list-style:none; padding:10px 16px; font-weight:600; font-size:.92rem; color:var(--brand)}
details.opt>summary::-webkit-details-marker{display:none}
details.opt>summary::before{content:"▸  "; font-size:.8em}
details.opt[open]>summary::before{content:"▾  "}
details.opt[open]>summary{border-bottom:1px solid var(--border)}
details.opt .body{padding:2px 16px 14px}
.checkrow{display:flex; align-items:center; gap:12px; margin:34px 0 10px; font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-fg)}
.checkrow::before,.checkrow::after{content:""; flex:1; height:1px; background:var(--border)}
details.q{border:1px solid var(--border); border-radius:var(--radius); margin:12px 0; background:var(--card); overflow:hidden}
details.q>summary{cursor:pointer; list-style:none; padding:13px 16px; display:flex; gap:11px; align-items:flex-start; font-weight:550}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary:hover{background:var(--muted)}
details.q>summary>span:not(.qt):not(.chev){min-width:0; overflow-wrap:anywhere}
.qt{flex:none; font-size:.6rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:4px 8px; border-radius:6px; margin-top:2px;
  background:var(--muted); color:var(--muted-fg); border:1px solid var(--border)}
.qt.pyq{background:var(--primary); color:var(--primary-fg); border-color:var(--primary)}
.chev{margin-left:auto; flex:none; color:var(--muted-fg); transition:transform .2s}
details.q[open] .chev{transform:rotate(90deg)}
details.q .ans{padding:2px 18px 16px; border-top:1px solid var(--border); background:var(--muted-2)}
details.q .ans>*:first-child{margin-top:12px}

/* theme toggle */
.themebtn{position:fixed; top:14px; right:14px; z-index:20; background:var(--card); border:1px solid var(--border); color:var(--fg);
  border-radius:8px; padding:7px 12px; font:inherit; font-size:.8rem; font-weight:500; cursor:pointer; box-shadow:var(--shadow-sm)}
.themebtn:hover{background:var(--muted)}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
.tocwrap-mobile{display:block; padding:18px clamp(16px,5vw,72px) 0}
@media(min-width:1060px){.tocwrap-mobile{display:none}}
details.mtoc{border:1px solid var(--border); border-radius:var(--radius); background:var(--card); padding:2px 6px}
details.mtoc>summary{padding:11px; font-weight:600; cursor:pointer}
details.mtoc a{display:block; padding:6px 12px; color:var(--muted-fg); text-decoration:none}

@media (max-width:700px){
  html,body{overflow-x:hidden}
  body{font-size:16px}
  main{padding:0 16px 96px}
  .themebtn{top:auto; bottom:14px}
  .card{padding:15px 15px}
  .steps>li{padding-left:34px}
  .steps>li::before{width:23px; height:23px; font-size:.72rem}
  .eq math{font-size:1.15em}
  .tbl{font-size:.85rem}
  .tbl th,.tbl td{padding:7px 9px}
  figure.fig{padding:10px}
}
@media print{.toc,.themebtn,.tocwrap-mobile{display:none} details{open:true}}

/* memory sheet */
.fl{list-style:none; padding:0; max-width:none; margin:10px 0 0}
.fl>li{display:grid; grid-template-columns:minmax(0,15em) minmax(0,1fr); gap:4px 18px; padding:10px 2px; margin:0; border-bottom:1px solid var(--border); align-items:baseline}
.fl>li>span:first-child{color:var(--muted-fg); font-size:.93rem}
.fl>li>span:last-child{overflow-x:auto; overflow-y:hidden}
.fl .w{display:block; margin-top:5px; font-size:.86rem; line-height:1.55; color:var(--muted-fg)}
@media(min-width:701px){#notation .fl>li{grid-template-columns:minmax(0,9em) minmax(0,1fr)}}
@media(max-width:700px){.fl>li{grid-template-columns:minmax(0,1fr)}}
.grouphead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin:2em 0 0}
.grouphead h3{margin:0}
.grouphead a{font-size:.85rem}
.pf{border-top:1px solid var(--border); padding-top:4px; margin-top:26px}
.pf h4{font-size:1.05rem; line-height:1.45; margin:.7em 0 .5em}
.pf .idea, .drill .idea{margin:8px 0}
.drill .chain{margin:8px 0}
.chain{list-style:none; padding:0; margin:12px 0; max-width:none}
.chain>li{padding:6px 0; margin:0; border-bottom:1px dashed var(--border)}
.chain>li:last-child{border-bottom:0}
.chain .why{margin-left:12px; color:var(--muted-fg); font-size:.88rem}
.chain .why::before{content:"∵ "}
.drill{border:1.5px solid var(--fg); border-radius:var(--radius); padding:18px 20px; margin:18px 0; background:var(--card)}
.drill .meta{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:.8rem; color:var(--muted-fg); font-weight:600}
.drill .dq{font-size:1.12rem; font-weight:600; margin:14px 0 10px; min-height:2.4em}
.drill .da{background:var(--muted-2); border:1px solid var(--border); border-radius:8px; padding:4px 14px; margin:8px 0 12px}
.drill .btns{display:flex; gap:8px; flex-wrap:wrap}
.drill button, .filters button{font:inherit; font-size:.88rem; font-weight:600; border-radius:8px; padding:9px 16px; cursor:pointer; border:1px solid var(--border-2); background:var(--card); color:var(--fg)}
.drill button.go{background:var(--primary); color:var(--primary-fg); border-color:var(--primary)}
.drill button.yes{background:var(--brand); color:var(--brand-fg); border-color:var(--brand)}
.filters{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0}
.filters button[aria-pressed="true"]{background:var(--primary); color:var(--primary-fg); border-color:var(--primary)}
.bar{height:6px; border-radius:3px; background:var(--muted); overflow:hidden; margin-top:8px}
.bar>i{display:block; height:100%; width:0; background:var(--brand); transition:width .2s}

/* checklist and folded proof steps (End-sem sheet) */
.checklist{list-style:none; padding:0; margin:14px 0}
.checklist li{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius); margin:8px 0; background:var(--card)}
.checklist label{display:flex; gap:11px; align-items:flex-start; cursor:pointer; flex:1}
.checklist input{width:18px; height:18px; margin-top:3px; accent-color:var(--brand); flex:none}
.checklist li.done{background:var(--brand-soft); border-color:color-mix(in srgb,var(--brand) 35%,var(--border))}
.checklist li.done label{color:var(--muted-fg); text-decoration:line-through; text-decoration-color:var(--border-2)}
.checklist a{flex:none; font-size:.88rem; font-weight:600; padding-top:2px}
.checkbar{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin:6px 0 10px; font-weight:600}
.checkbar button, .pf .stepbtn{font:inherit; font-size:.85rem; font-weight:600; border-radius:8px; padding:7px 14px; cursor:pointer; border:1px solid var(--border-2); background:var(--card); color:var(--fg)}
.pf .stepbtn{margin:4px 0 6px}
.pf .stepbtn[aria-expanded="true"]{background:var(--muted)}
.linkbtn{font:inherit; background:none; border:0; padding:0; color:var(--brand); text-decoration:underline; cursor:pointer}
.pf .steps[hidden]{display:none}
@media print{.pf .steps[hidden]{display:block} .pf .stepbtn,.checkbar button,.linkbtn{display:none}}

/* End-sem blitz: worked answers laid out as formula, source, working */
.sol{display:grid; grid-template-columns:150px 1fr; gap:4px 16px; padding:10px 0; border-top:1px solid var(--border)}
.sol:first-child{border-top:0; padding-top:2px}
.sol .sl{font-size:.8rem; font-weight:650; color:var(--muted-fg); padding-top:3px}
details.linewhy{margin:0}
:root{interpolate-size:allow-keywords}
details.linewhy::details-content{height:0; overflow:clip; opacity:0; transition:height .28s ease, opacity .2s ease, content-visibility .28s allow-discrete}
details.linewhy[open]::details-content{height:auto; opacity:1}
details.linewhy>summary::before{transition:transform .2s ease}
@media (prefers-reduced-motion: reduce){details.linewhy::details-content{transition:none}}
.eqn{display:none} @media(max-width:600px){.eqw{display:none} .eqn{display:block}}
details.linewhy>summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 8px 0 0; border:0; background:none; font-size:.86rem; font-weight:600; color:var(--muted-fg)}
details.linewhy>summary:hover{color:var(--fg)}
details.linewhy>summary::-webkit-details-marker{display:none}
details.linewhy>summary::before{content:"+"; font-weight:700; width:.9em; text-align:center}
details.linewhy[open]>summary::before{content:"\2212"}
details.linewhy>summary span{font-weight:400}
details.linewhy[open]>summary{color:var(--fg)}
details.linewhy>.steps{margin:0 0 .8em; padding:12px 14px 4px; border-radius:10px; background:var(--muted-2)}
details.linewhy .steps>li::before{background:transparent; color:var(--muted-fg); border:1px solid var(--border-2)}
.closeall{display:none; margin:6px 0 0; min-height:44px; padding:0 14px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; font-size:.86rem; cursor:pointer}
.closeall.show{display:inline-flex; align-items:center}
@media print{details.linewhy>.steps{display:block}}
@media(max-width:600px){details.linewhy>.steps{padding-left:6px; padding-right:6px} details.linewhy .steps>li{padding-left:30px} details.linewhy .steps math[display="block"]{font-size:.84em}}
.sol .sb{min-width:0; overflow-wrap:break-word} .sol .sb math[display="block"]{max-width:100%; overflow-x:auto; overflow-y:hidden; padding-block:4px; scrollbar-width:thin}
@media(max-width:600px){.sol .sb .steps>li{padding-left:30px} .steps math[display="block"]{font-size:.88em}}
.steps math[display="block"]{max-width:100%; overflow-x:auto; overflow-y:hidden; padding-block:4px; scrollbar-width:thin}
.sol .sb>*:first-child{margin-top:0} .sol .sb>*:last-child{margin-bottom:0}
@media(max-width:600px){.sol{grid-template-columns:1fr}}
.card.exam h4{margin:.5em 0 .2em}
h1,h2,h3,h4{text-wrap:balance} p,li{text-wrap:pretty}
.tbl{font-variant-numeric:tabular-nums}
.tag, .qt{text-transform:none; letter-spacing:0; font-size:.74rem}
.totop{width:44px; height:44px}
button:active, details.q>summary:active{transform:scale(.98)}
.tbl.sheet td:last-child{color:var(--muted-fg); white-space:nowrap}
</style>
<style>

/* phone and tablet: a sticky bar that opens a menu of pages and sections */
@media(max-width:1059px){
  .themebtn{top:auto; bottom:14px}
  .tocwrap-mobile{position:sticky; top:0; z-index:15; background:var(--bg); border-bottom:1px solid var(--border);
    margin:0 calc(-1 * clamp(18px,5vw,72px)); padding:8px clamp(18px,5vw,72px)}
  details.mtoc{border:0; padding:0; background:transparent}
  details.mtoc>summary{list-style:none; display:flex; align-items:center; gap:10px; padding:4px 0; font-size:.9rem}
  details.mtoc>summary::-webkit-details-marker{display:none}
  details.mtoc .here{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted-fg); font-weight:500}
  details.mtoc .mbtn{flex:none; border:1px solid var(--border-2); border-radius:8px; padding:6px 12px; font-weight:600; background:var(--card); color:var(--fg)}
  details.mtoc[open] .mbtn{background:var(--primary); color:var(--primary-fg); border-color:var(--primary)}
  .mpanel{max-height:calc(100vh - 70px); max-height:calc(100dvh - 70px); overflow-y:auto; padding:6px 0 14px; overscroll-behavior:contain}
  .mgrp{text-transform:uppercase; letter-spacing:.11em; font-size:.66rem; color:var(--muted-fg); font-weight:700; margin:14px 0 4px}
  details.mtoc .mpanel>a{display:block; padding:8px 4px; color:var(--fg); text-decoration:none; border-bottom:1px solid var(--border); font-size:.95rem}
}
@media(max-width:700px){
  html,body{overflow-x:clip}
  .tocwrap-mobile{margin:0 -16px; padding:8px 16px}
}

/* back-to-top arrow, shown once the page is scrolled */
.totop{position:fixed; right:14px; bottom:14px; z-index:20; width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
  background:var(--card); color:var(--fg); border:1px solid var(--border); box-shadow:var(--shadow-sm); cursor:pointer;
  font:inherit; font-size:1.2rem; line-height:1; opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity .2s, transform .2s, visibility .2s}
.totop:hover{background:var(--muted)}
.totop.show{opacity:1; visibility:visible; transform:none}
@media(max-width:1059px){.totop{bottom:62px}}
@media print{.totop{display:none}}


/* QMD additions */
figure.fig img{display:block; width:100%; height:auto; max-width:640px; margin:0 auto; border-radius:6px; background:#fff}
figure.fig img.narrow{max-width:420px}
.credit{font-size:.78rem; color:var(--muted-fg)}
.mod{display:inline-block; font-size:.74rem; font-weight:650; color:var(--brand); background:var(--brand-soft); border:1px solid color-mix(in srgb,var(--brand) 30%,var(--border)); border-radius:6px; padding:2px 8px; margin-left:6px; vertical-align:middle}
.opts{list-style:none; padding-left:0; margin:.4em 0}
.opts li{margin:.15em 0}
.cmp{width:100%}
.tbl.cmp td:first-child{font-weight:600}
/* games */
.game{border:1.5px dashed color-mix(in srgb,var(--brand) 55%,var(--border)); border-radius:var(--radius); padding:16px 18px; margin:26px 0; background:var(--card)}
.game>.tag{background:var(--brand); color:var(--brand-fg); border-color:var(--brand)}
.game h4{margin:.2em 0 .4em}
.gmeta{font-size:.84rem; color:var(--muted-fg); font-weight:600; margin:6px 0 8px; font-variant-numeric:tabular-nums}
.gq{font-weight:600; font-size:1.02rem; margin:.4em 0 .6em}
.gopts{display:grid; gap:8px}
.game button{font:inherit; min-height:44px; border-radius:8px; cursor:pointer; color:var(--fg); background:var(--card); border:1px solid var(--border-2); padding:8px 14px; text-align:left}
.game button:hover:not(:disabled){background:var(--muted)}
.game button.go{background:var(--primary); color:var(--primary-fg); border-color:var(--primary); text-align:center}
.game button.sel{border-color:var(--brand); box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 45%,transparent)}
.game button.right, .ginput.right{background:var(--brand-soft); border-color:var(--brand); color:var(--fg)}
.game button.wrong, .ginput.wrong{background:var(--destructive-soft); border-color:var(--destructive)}
.game button:disabled{cursor:default}
.gwhy{font-size:.92rem; margin:10px 0 4px; max-width:none}
.gwhy.ok{color:var(--brand)} .gwhy.no{color:var(--destructive)}
.gbtns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.gmatch{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:10px}
.gcol{display:grid; gap:8px; align-content:start}
.gcard{font-size:.9rem; line-height:1.35; min-width:0; overflow-wrap:anywhere}
.gpool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.gpool:empty{display:none}
.gbuckets{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.gbucket{border:1px solid var(--border); border-radius:8px; padding:8px; background:var(--muted-2); min-width:0}
.game .gbhead{width:100%; font-weight:700; text-align:center; background:var(--muted)}
.gblist{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.gblist .gcard{font-size:.82rem; min-height:36px; padding:4px 10px}
.gblanks{padding-left:1.3em; max-width:none}
.gblanks li{margin:.6em 0 1em}
.gblanks .gq{font-weight:500; margin:.1em 0 .4em}
.grow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.ginput{font:inherit; min-height:44px; padding:6px 12px; border-radius:8px; border:1px solid var(--border-2); background:var(--bg); color:var(--fg); flex:1 1 160px; min-width:0}
.gres{font-size:.88rem; font-weight:600}
.gres.ok{color:var(--brand)} .gres.no{color:var(--destructive)}
@media(max-width:600px){.gmatch{grid-template-columns:1fr 1fr} .game{padding:14px 12px}}
@media print{.game{display:none}}
</style>
</head>
